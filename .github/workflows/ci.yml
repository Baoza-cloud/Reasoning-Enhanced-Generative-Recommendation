name: quality

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[serving,dev]'
      - name: Smoke
        run: make smoke
      - name: Static checks
        run: python -m ruff check --no-cache src scripts tests

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: regenrec:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
