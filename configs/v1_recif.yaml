seed: 2026
device: cpu

data:
  catalog_path: data/recif/processed/catalog.json
  examples_path: data/recif/processed/examples.jsonl
  max_examples: 100000
  max_history: 100
  num_behaviors: 2
  num_time_buckets: 32

generator:
  model_dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  feedforward_dim: 1024
  dropout: 0.1
  short_term_window: 10
  epochs: 10
  batch_size: 128
  learning_rate: 0.0003

output_dir: artifacts/recif_v1
