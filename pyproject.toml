[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regenrec"
version = "0.1.0"
description = "Reasoning-enhanced generative recommendation for e-commerce"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psutil>=5.9",
  "torch>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = [
  "huggingface-hub>=0.25",
  "pyarrow>=15",
]
embeddings = [
  "sentence-transformers>=3.0,<4.0",
  "transformers>=4.41,<5.0",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
]
causal = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]
serving = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
]
benchmark = [
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
